<div class="container mt-4">

    <div class="card shadow-sm p-4">

        <h2 class="mb-4">
            <i class="fa-solid fa-circle-user"></i>
            Perfil del Chef
        </h2>

        @if(userDetail()) {

            <p>
                <strong>Nombre:</strong>
                {{ userDetail()?.firstName }} {{ userDetail()?.lastName }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ userDetail()?.email }}
            </p>

        }

        <div class="d-flex justify-content-end">
            <button class="btn btn-outline-secondary" (click)="onOpenModal()"> Editar Perfil</button>
        </div>

    </div>

    @if (showEditModalProfile()) {
        <div class="modal-backdrop-custom">
            <div class="custom-modal card shadow-lg p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>
                        Editar Perfil
                    </h4>

                    <button
                        class="btn-close"
                        (click)="onCloseModal()"
                    ></button>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [value]="firstNameInput()"
                        (input)="firstNameInput.set($any($event.target).value)"
                    />
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [value]="lastNameInput()"
                        (input)="lastNameInput.set($any($event.target).value)"
                    />
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [value]="emailInput()"
                        (input)="emailInput.set($any($event.target).value)"
                    />
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">

                    <button
                        class="btn btn-outline-danger"
                        (click)="onCloseModal()"
                    >
                        Cancelar
                    </button>

                    <button
                        class="btn btn-outline-success"
                        (click)="saveUserDetail()"
                    >
                        Guardar
                    </button>

                </div>

            </div>

        </div>


    }

</div>
